<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steel and rust study</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; background: #c4c9c5; color: #26302d; font: 14px system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    header { position: absolute; top: 16px; left: 16px; padding: 14px; background: #eff1edee; border-radius: 8px; }
    h1 { margin: 0 0 9px; font-size: 20px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 1px solid #8e9b95; border-radius: 5px; padding: 6px 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #354843; color: white; }
    p { margin: 8px 0 0; color: #475650; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Steel and rust study</h1>
    <nav aria-label="Camera views">
      <button type="button" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" data-view="pipes" aria-pressed="false">Pipes</button>
      <button type="button" data-view="cages" aria-pressed="false">Cages</button>
      <button type="button" id="polished-edges" aria-pressed="true">Polished edges</button>
      <button type="button" id="banded-gloss" aria-pressed="true">Banded gloss</button>
      <button type="button" id="painted-values" aria-pressed="true">Painted values</button>
      <button type="button" id="silhouette-highlight" aria-pressed="true">Silhouette highlight</button>
    </nav>
    <nav aria-label="Rust patterns" style="margin-top: 8px">
      <button type="button" id="rust-edge" aria-pressed="true">Edge rust</button>
      <button type="button" id="rust-surface" aria-pressed="true">Surface rust</button>
      <button type="button" id="rust-rain" aria-pressed="true">Raindrop rust</button>
    </nav>
    <p>Drag to orbit · Scroll to zoom</p>
  </header>
  <script type="module" src="./main.ts"></script>
</body>
</html>
